<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Backend" />

<f:section name="Content">

    <h1><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:log.title" /></h1>

    <div class="btn-group mb-3">
        <a href="{f:be.uri(route: 'content_semanticdelivery')}" class="btn btn-default btn-sm">
            <f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:nav.preview" />
        </a>
        <a href="{f:be.uri(route: 'content_semanticdelivery.queue')}" class="btn btn-default btn-sm">
            <f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:nav.queue" />
        </a>
        <a href="{f:be.uri(route: 'content_semanticdelivery.log')}" class="btn btn-default btn-sm active">
            <f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:nav.log" />
        </a>
    </div>

    <h2><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:status.completed" /></h2>

    <f:if condition="{completedJobs}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:queue.distributor" /></th>
                            <th><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:queue.platform" /></th>
                            <th><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:log.externalId" /></th>
                            <th><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:log.externalUrl" /></th>
                            <th><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:log.executedAt" /></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{completedJobs}" as="job">
                            <tr>
                                <td>{job.distributor}</td>
                                <td>{job.platform}</td>
                                <td>{job.externalId}</td>
                                <td>
                                    <f:if condition="{job.externalUrl}">
                                        <a href="{job.externalUrl}" target="_blank">{job.externalUrl}</a>
                                    </f:if>
                                </td>
                                <td><f:format.date format="Y-m-d H:i">{job.executedAt}</f:format.date></td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:then>
        <f:else>
            <div class="callout callout-info">
                <f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:log.noEntries" />
            </div>
        </f:else>
    </f:if>

    <h2><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:status.failed" /></h2>

    <f:if condition="{failedJobs}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:queue.distributor" /></th>
                            <th><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:queue.platform" /></th>
                            <th><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:log.error" /></th>
                            <th><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:log.executedAt" /></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{failedJobs}" as="job">
                            <tr>
                                <td>{job.distributor}</td>
                                <td>{job.platform}</td>
                                <td class="text-danger">{job.errorMessage}</td>
                                <td><f:format.date format="Y-m-d H:i">{job.executedAt}</f:format.date></td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:then>
        <f:else>
            <div class="callout callout-info">
                <f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:log.noEntries" />
            </div>
        </f:else>
    </f:if>

</f:section>

</html>
