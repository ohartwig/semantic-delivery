<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Backend" />

<f:section name="Content">

    <h1><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:queue.title" /></h1>

    <div class="btn-group mb-3">
        <a href="{f:be.uri(route: 'content_semanticdelivery')}" class="btn btn-default btn-sm">
            <f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:nav.preview" />
        </a>
        <a href="{f:be.uri(route: 'content_semanticdelivery.queue')}" class="btn btn-default btn-sm active">
            <f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:nav.queue" />
        </a>
        <a href="{f:be.uri(route: 'content_semanticdelivery.log')}" class="btn btn-default btn-sm">
            <f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:nav.log" />
        </a>
    </div>

    <f:if condition="{pendingJobs}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:queue.distributor" /></th>
                            <th><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:queue.platform" /></th>
                            <th><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:preview.status" /></th>
                            <th><f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:queue.scheduled" /></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{pendingJobs}" as="job">
                            <tr>
                                <td>{job.distributor}</td>
                                <td>{job.platform}</td>
                                <td><span class="badge badge-warning">{job.status}</span></td>
                                <td>
                                    <f:if condition="{job.scheduledAt}">
                                        <f:format.date format="Y-m-d H:i">{job.scheduledAt}</f:format.date>
                                    </f:if>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:then>
        <f:else>
            <div class="callout callout-info">
                <f:translate key="LLL:EXT:semantic_delivery/Resources/Private/Language/locallang.xlf:queue.noJobs" />
            </div>
        </f:else>
    </f:if>

</f:section>

</html>
